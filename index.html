<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Agende seu horário na Jeci Vieira Nails — nail designer profissional." />
  <title>Jeci Vieira Nails — Agendamento</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/pages/index.css" />
</head>

<body>

  <!-- ===== TELA DE BOAS-VINDAS (A2, A3) ===== -->
  <main id="home" class="home-screen">

    <!-- Bloco 1: Logo -->
    <img src="img/logoJeciVieira.svg" alt="Jeci Vieira Nails — Logo" class="salon-logo" />

    <!-- Bloco 2: Frases -->
    <header class="salon-header">
      <h1 id="welcome-title" class="salon-name">Bem-vinda!</h1>
      <p id="welcome-tagline" class="salon-tagline">Pronta para um momento de cuidado com sua beleza?</p>
    </header>

    <!-- Área de avisos dinâmica (configurada pelo Admin - B) -->
    <section class="notice-board" aria-label="Avisos do salão">
      <p id="salon-notice" class="notice-text"><!-- Carregado via JS --></p>
    </section>

    <!-- CTA: Iniciar agendamento (A4) -->
    <a id="btn-agendar" href="pages/agendamento.html" class="btn-primary" role="button">
      Agendar Horário
    </a>

    <!-- Rodapé: Contatos e Endereço -->
    <footer class="salon-footer">
      <p id="salon-phone" class="contact-item"><!-- Carregado via JS --></p>
      <p id="salon-address" class="contact-item"><!-- Carregado via JS --></p>
    </footer>

  </main>

  <!-- Scripts -->
  <script type="module" src="js/firebase/config.js"></script>
  <script type="module" src="js/global.js"></script>
  <script type="module" src="js/pages/index.js"></script>

</body>

</html>
