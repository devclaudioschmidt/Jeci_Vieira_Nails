<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <meta name="description" content="Agende seu horário na Jeci Vieira Nails — nail designer profissional." />
  <title>Jeci Vieira Nails — Agendamento</title>

  <!-- Web App / PWA Config -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="img/icon-192.png" />
  <meta name="theme-color" content="#0E0D0D" />
  
  <!-- iOS Web App Config -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jeci Nails" />
  <link rel="apple-touch-icon" href="img/logoJeciVieira.svg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/pages/index.css" />
</head>

<body>

  <!-- ===== TELA DE BOAS-VINDAS (A2, A3) ===== -->
  <main id="home" class="home-screen bg-gradient">

    <!-- Bloco 1: Logo -->
    <img src="img/logoJeciVieira.svg" alt="Jeci Vieira Nails — Logo" class="salon-logo" />

    <!-- Bloco 2: Frases -->
    <header class="salon-header">
      <h1 id="welcome-title" class="salon-name">Bem-vinda!</h1>
      <p id="welcome-tagline" class="salon-tagline">Pronta para um momento de cuidado com sua beleza?</p>
    </header>

    <!-- Área de avisos dinâmica (configurada pelo Admin - B) -->
    <section class="notice-board" aria-label="Avisos do salão">
      <p id="salon-notice" class="notice-text"><!-- Carregado via JS --></p>
    </section>

    <!-- CTA: Iniciar agendamento (A4) -->
    <a id="btn-agendar" href="pages/agendamento.html" class="btn-primary" role="button">
      Agendar Horário
    </a>

    <!-- Consulta de Agendamentos -->
    <button id="btn-open-search" class="btn-secondary" style="margin-top: var(--space-4);">
      Consultar meus agendamentos
    </button>

    <a href="pages/admin.html" class="btn-secondary" style="margin-bottom: var(--space-8);">Área Administrativa</a>

    <!-- Rodapé: Contatos e Endereço -->
    <footer class="salon-footer">
      <p id="salon-phone" class="contact-item"><!-- Carregado via JS --></p>
      <p id="salon-address" class="contact-item"><!-- Carregado via JS --></p>
    </footer>

  </main>

  <!-- ===== MODAL DE CONSULTA ===== -->
  <dialog id="modal-search-appointments" class="app-modal" aria-labelledby="modal-search-title">
    <div class="modal-content">
      <header class="modal-header">
        <h3 id="modal-search-title">Meus Agendamentos</h3>
        <button id="btn-close-search" aria-label="Fechar consulta">&times;</button>
      </header>
      
      <form id="form-search-appointments">
        <label for="search-phone">Informe seu WhatsApp</label>
        <input type="tel" id="search-phone" name="phone" required placeholder="(11) 99999-9999" />
        
        <div class="modal-actions">
          <button type="submit" id="btn-submit-search" class="btn-primary">Buscar</button>
        </div>
      </form>

      <ul id="search-results-list" class="appointments-list hidden">
        <!-- Populado via JS -->
      </ul>
    </div>
  </dialog>

  <!-- ===== TEMPLATES ===== -->
  <template id="tpl-search-result">
    <li class="appointment-card slide-up-anim search-result-card">
      <div class="search-result-row">
        <strong class="search-date"></strong>
        <strong class="search-time"></strong>
      </div>
      <div class="search-result-row">
        <span class="search-procedure"></span>
        <span class="search-price"></span>
      </div>
    </li>
  </template>

  <!-- Scripts -->
  <script type="module" src="js/firebase/config.js"></script>
  <script type="module" src="js/global.js"></script>
  <script type="module" src="js/pages/index.js"></script>

  <!-- Registro do Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('[SW] Registrado com sucesso'))
          .catch((err) => console.warn('[SW] Erro ao registrar:', err));
      });
    }
  </script>

</body>

</html>
