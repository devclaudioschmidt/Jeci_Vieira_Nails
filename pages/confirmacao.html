<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Confirme seu agendamento na Jeci Vieira Nails." />
  <title>Confirmação — Jeci Vieira Nails</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/pages/confirmacao.css" />
</head>
<body class="bg-gradient">

  <header class="page-header">
    <a href="agendamento.html" class="btn-back" aria-label="Voltar ao agendamento">&#8592;</a>
    <h2 class="page-title">Resumo do Agendamento</h2>
  </header>

  <main class="confirmation-screen">

    <!-- Ícone de sucesso (A5.5) -->
    <div class="success-icon" aria-hidden="true">&#10003;</div>

    <!-- Resumo dos dados escolhidos -->
    <section class="booking-summary" aria-label="Resumo do agendamento">
      <div class="summary-row">
        <span class="summary-label">Procedimento</span>
        <span id="summary-procedure" class="summary-value">—</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Data</span>
        <span id="summary-date" class="summary-value">—</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Horário</span>
        <span id="summary-time" class="summary-value">—</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Nome</span>
        <span id="summary-name" class="summary-value">—</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">WhatsApp</span>
        <span id="summary-phone" class="summary-value">—</span>
      </div>
    </section>

    <!-- CTA: Confirmar e enviar via WhatsApp (A5.6) -->
    <button id="btn-confirmar-whatsapp" class="btn-whatsapp">
      &#128241; Confirmar pelo WhatsApp
    </button>

    <!-- Voltar ao início (A5.7) -->
    <a href="../index.html" id="btn-novo-agendamento" class="btn-secondary">
      Fazer outro agendamento
    </a>

  </main>

  <script type="module" src="../js/firebase/config.js"></script>
  <script type="module" src="../js/global.js"></script>
  <script type="module" src="../js/pages/confirmacao.js"></script>

</body>
</html>
