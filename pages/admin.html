<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Painel administrativo da Jeci Vieira Nails — gerencie agendamentos e configurações." />
  <title>Admin — Jeci Vieira Nails</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/pages/admin.css" />
</head>
<body>

  <!-- ===== TELA DE LOGIN (B1) ===== -->
  <section id="login-screen" class="login-screen" aria-label="Login do administrador">
    <div class="login-card">
      <img src="../assets/logo.svg" alt="Jeci Vieira Nails" class="login-logo" />
      <h1 class="login-title">Área Restrita</h1>

      <form id="login-form" novalidate>
        <label for="admin-email">E-mail</label>
        <input id="admin-email" type="email" name="email" placeholder="seuemail@email.com" autocomplete="email" required />

        <label for="admin-password">Senha</label>
        <input id="admin-password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />

        <p id="login-error" class="error-msg" role="alert" aria-live="polite"></p>

        <button id="btn-login" type="submit" class="btn-primary">Entrar</button>
      </form>
    </div>
  </section>

  <!-- ===== PAINEL ADMIN (B2) — oculto até login ===== -->
  <section id="admin-panel" class="admin-panel hidden" aria-label="Painel administrativo">

    <!-- Barra superior -->
    <header class="admin-header">
      <h2 class="admin-title">Agenda</h2>
      <nav class="admin-nav" aria-label="Navegação admin">
        <button id="nav-agenda"      class="nav-btn active"   data-view="agenda">Agenda</button>
        <button id="nav-procedimentos" class="nav-btn"        data-view="procedimentos">Procedimentos</button>
        <button id="nav-configuracoes" class="nav-btn"        data-view="configuracoes">Configurações</button>
      </nav>
      <button id="btn-logout" class="btn-logout" aria-label="Sair">Sair</button>
    </header>

    <!-- VIEW: Agenda (B2) -->
    <div id="view-agenda" class="admin-view active">
      <!-- Calendário compacto -->
      <div id="admin-calendar" class="admin-calendar" aria-label="Calendário de agendamentos">
        <!-- Gerado via JS -->
      </div>
      <!-- Lista de agendamentos do dia selecionado -->
      <ul id="appointments-list" class="appointments-list" aria-label="Agendamentos do dia">
        <!-- Populado via JS -->
      </ul>
    </div>

    <!-- VIEW: Procedimentos -->
    <div id="view-procedimentos" class="admin-view hidden">
      <div class="view-toolbar">
        <h3>Procedimentos</h3>
        <button id="btn-add-procedure" class="btn-primary btn-sm">+ Novo</button>
      </div>
      <ul id="procedures-admin-list" class="procedures-admin-list">
        <!-- Populado via JS -->
      </ul>
    </div>

    <!-- VIEW: Configurações -->
    <div id="view-configuracoes" class="admin-view hidden">
      <h3>Configurações do Salão</h3>
      <form id="salon-config-form">
        <label for="config-phone">Telefone de contato</label>
        <input id="config-phone" type="tel" name="phone" placeholder="(00) 00000-0000" />

        <label for="config-address">Endereço</label>
        <input id="config-address" type="text" name="address" placeholder="Rua, número..." />

        <label for="config-notice">Aviso para clientes</label>
        <textarea id="config-notice" name="notice" rows="3" placeholder="Ex.: Férias em janeiro..."></textarea>

        <label for="config-hours-start">Horário de abertura</label>
        <input id="config-hours-start" type="time" name="hoursStart" value="09:00" />

        <label for="config-hours-end">Horário de encerramento</label>
        <input id="config-hours-end" type="time" name="hoursEnd" value="18:00" />

        <button id="btn-save-config" type="submit" class="btn-primary">Salvar</button>
      </form>
    </div>

  </section>

  <script type="module" src="../js/firebase/config.js"></script>
  <script type="module" src="../js/global.js"></script>
  <script type="module" src="../js/pages/admin.js"></script>

</body>
</html>
